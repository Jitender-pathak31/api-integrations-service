spring.application.name=api-integrations-service
server.port=8081

# External 3rd-Party API Base URL (JSONPlaceholder requires no API key)
integration.external-api.base-url=https://jsonplaceholder.typicode.com

# Local H2 In-Memory Database for storing transformed & edited records
spring.datasource.url=jdbc:h2:mem:integrationsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

